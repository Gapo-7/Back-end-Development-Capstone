apiVersion: apps/v1
kind: Deployment
metadata:
  name: djangoserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: djangoserver
  template:
    metadata:
      labels:
        app: djangoserver
    spec:
      containers:
        - name: djangoserver
          image: us.icr.io/sn-labs-u240928/djangoserver:1
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DJANGO_ALLOWED_HOSTS
              value: "*"
            - name: DJANGO_DEBUG
              value: "0"
            - name: PICTURES_SERVICE_URL
              value: "https://pictures.2gbzi6h6x5jf.us-south.codeengine.appdomain.cloud"
            - name: SONGS_SERVICE_URL
              value: "http://songs-sn-labs-u240928.labs-prod-openshift-san-a45631dc5778dc6371c67d206ba9ae5c-0000.us-east.containers.appdomain.cloud"
---
apiVersion: v1
kind: Service
metadata:
  name: djangoserver
spec:
  selector:
    app: djangoserver
  ports:
    - port: 8000
      targetPort: 8000
